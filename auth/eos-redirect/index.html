<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Epic Games Redirect Handler</title>
</head>
<body>
  <h2>Epic OAuth Redirect</h2>
  <div id="info"></div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      const infoDiv = document.getElementById("info");
      infoDiv.innerHTML = `
        <p><b>Code:</b> ${code || "(none)"}</p>
        <p><b>State:</b> ${state || "(none)"}</p>
        <p><b>Error:</b> ${error || "(none)"}</p>
      `;
    })();
  </script>
</body>
</html>
